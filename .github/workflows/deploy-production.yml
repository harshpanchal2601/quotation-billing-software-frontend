name: Deploy Frontend

on:
  push:
    branches:
      - feat/code-migration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and Deploy Frontend
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Verify frontend build
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing required secret: EC2_SSH_PRIVATE_KEY"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/erp-key.pem"
          chmod 600 "$HOME/.ssh/erp-key.pem"

      - name: Deploy frontend to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "Missing required secret: EC2_HOST"
            exit 1
          fi

          if [ -z "$EC2_USER" ]; then
            echo "Missing required secret: EC2_USER"
            exit 1
          fi

          DEPLOY_PORT="${EC2_PORT:-22}"
          if ! printf '%s' "$DEPLOY_PORT" | grep -Eq '^[0-9]+$'; then
            echo "EC2_PORT must be numeric when set."
            exit 1
          fi

          DEPLOY_TARGET="${EC2_USER}@${EC2_HOST}"

          zip -qr frontend-dist.zip dist

          scp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i "$HOME/.ssh/erp-key.pem" \
            -P "$DEPLOY_PORT" \
            frontend-dist.zip \
            "$DEPLOY_TARGET:/tmp/erp-frontend-dist.zip"

          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i "$HOME/.ssh/erp-key.pem" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_TARGET" <<'REMOTE_SCRIPT'

          set -e

          APP_NAME="erp-system-frontend"
          APP_PATH="/var/www/erp-system-frontend"
          APP_PORT="4173"

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          echo "Publishing frontend build..."
          mkdir -p "$APP_PATH"
          rm -rf "$APP_PATH/dist"

          if ! command -v unzip >/dev/null 2>&1; then
            echo "unzip is required on the EC2 instance to deploy the frontend archive."
            exit 1
          fi

          unzip -q /tmp/erp-frontend-dist.zip -d "$APP_PATH"
          rm -f /tmp/erp-frontend-dist.zip

          if [ ! -f "$APP_PATH/dist/index.html" ]; then
            echo "Frontend build failed: dist/index.html not found."
            exit 1
          fi

          command -v pm2 >/dev/null 2>&1 || npm install -g pm2

          if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
            echo "Restarting frontend PM2 process..."
            pm2 restart "$APP_NAME"
          else
            echo "Creating frontend PM2 process..."
            pm2 serve "$APP_PATH/dist" "$APP_PORT" \
              --name "$APP_NAME" \
              --spa
          fi

          pm2 save
          pm2 status "$APP_NAME"

          echo "Frontend deployment completed."
          REMOTE_SCRIPT
